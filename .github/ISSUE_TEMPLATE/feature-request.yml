name: 功能建议
description: 提议新功能、协议扩展或文档改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景
      description: 说明要解决的问题和目标硬件场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述预期行为以及对协议、Flash 布局或兼容性的影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 列出已经考虑过的替代方法。
