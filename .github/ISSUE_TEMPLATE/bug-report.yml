name: 缺陷报告
description: 报告可复现的编译、通信或硬件行为问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交密钥、个人信息或未公开的安全漏洞细节。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 请提供分支、Commit ID 或 Release 版本。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 硬件与开发环境
      description: 例如板卡版本、Keil 版本、编译器和 DFP 版本。
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 描述实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、完整的复现步骤和必要日志。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可附接线方式、协议帧、截图或其他上下文。
